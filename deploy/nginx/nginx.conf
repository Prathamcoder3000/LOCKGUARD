worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;

    upstream lockguard_api {
        server api:8080;
    }

    upstream lockguard_frontend {
        server frontend:80;
    }

    upstream lockguard_protected_resource {
        server protected-resource:9000;
    }

    server {
        listen 80;
        server_name localhost;

        # Health probe for gateway
        location = /gateway/health {
            access_log off;
            return 200 '{"status":"ok","gateway":"nginx"}\n';
            add_header Content-Type application/json;
        }

        # Route API requests to LockGuard Go API
        location /api/ {
            proxy_pass http://lockguard_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health and readiness endpoints forwarded to API
        location ~ ^/(health|ready) {
            proxy_pass http://lockguard_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Route Protected Resource requests
        location /resource/ {
            proxy_pass http://lockguard_protected_resource/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Route all other dashboard requests to React SPA
        location / {
            proxy_pass http://lockguard_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}

